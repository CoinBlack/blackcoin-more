name: Build and Push Docker - 28.x
on: [push]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Native AMD64 Builder Job
  build-amd64:
    name: Build AMD64 Images (Native)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: BlackcoinDev/docker-blk
          ref: main

      - name: Set environment variables
        run: |
          echo "GIT_CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "GHCR_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build script for AMD64
        env:
          PLATFORM: linux/amd64
          DOCKER_HUB_USER: ghcr.io/${{ env.GHCR_OWNER }}
        run: ./gh-build-28.sh

  # 2. Native ARM64 Builder Job
  build-arm64:
    name: Build ARM64 Images (Native)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: BlackcoinDev/docker-blk
          ref: main

      - name: Set environment variables
        run: |
          echo "GIT_CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "GHCR_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build script for ARM64
        env:
          PLATFORM: linux/arm64
          DOCKER_HUB_USER: ghcr.io/${{ env.GHCR_OWNER }}
        run: ./gh-build-28.sh

  # 3. Manifest Assembly Job
  assemble-manifests:
    name: Create & Push Multi-Arch Manifests
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Registry
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract branch name
        run: |
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "GHCR_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Assemble and Publish Manifests
        run: |
          DOCKER_HUB_USER="${{ secrets.DOCKER_USERNAME }}"
          GHCR_USER="ghcr.io/${{ env.GHCR_OWNER }}"
          
          # A. Base Image Manifest
          docker buildx imagetools create -t ${DOCKER_HUB_USER}/blackcoin-more-28.4.0-base:${BRANCH} \
            ${GHCR_USER}/blackcoin-more-28.4.0-base:${BRANCH}-amd64 \
            ${GHCR_USER}/blackcoin-more-28.4.0-base:${BRANCH}-arm64

          # B. Debian Image Manifest
          docker buildx imagetools create -t ${DOCKER_HUB_USER}/blackcoin-more-debian-v28x:${BRANCH} \
            ${GHCR_USER}/blackcoin-more-debian-v28x:${BRANCH}-amd64 \
            ${GHCR_USER}/blackcoin-more-debian-v28x:${BRANCH}-arm64

          # C. Minimal Image Manifest
          docker buildx imagetools create -t ${DOCKER_HUB_USER}/blackcoin-more-minimal-v28x:${BRANCH} \
            ${GHCR_USER}/blackcoin-more-minimal-v28x:${BRANCH}-amd64 \
            ${GHCR_USER}/blackcoin-more-minimal-v28x:${BRANCH}-arm64
