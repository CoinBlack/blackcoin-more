name: Build and Push Docker - 28.x
on: [push]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Native AMD64 Builder Job
  build-amd64:
    name: Build AMD64 Images (Native)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: BlackcoinDev/docker-blk
          ref: main

      - name: Set environment variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_PREFIX=ghcr.io/${OWNER_LC}" >> $GITHUB_ENV
          echo "GIT_CURRENT_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build script for AMD64
        run: |
          export DOCKER_HUB_USER="${GHCR_PREFIX}"
          export PLATFORM="linux/amd64"
          ./gh-build-28.sh

  # 2. Native ARM64 Builder Job
  build-arm64:
    name: Build ARM64 Images (Native)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: BlackcoinDev/docker-blk
          ref: main

      - name: Set environment variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_PREFIX=ghcr.io/${OWNER_LC}" >> $GITHUB_ENV
          echo "GIT_CURRENT_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build script for ARM64
        run: |
          export DOCKER_HUB_USER="${GHCR_PREFIX}"
          export PLATFORM="linux/arm64"
          ./gh-build-28.sh

  # 3. Manifest Assembly Job — combines GHCR arch images into a unified Docker Hub tag
  assemble-manifests:
    name: Create & Push Multi-Arch Manifests
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Set environment variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_PREFIX=ghcr.io/${OWNER_LC}" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Registry
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Assemble and Publish Manifests
        run: |
          DHU="blackcoinorg"

          # A. Base Image Manifest
          docker buildx imagetools create \
            -t ${DHU}/blackcoin-more-28.4.0-base:${BRANCH} \
            ${GHCR_PREFIX}/blackcoin-more-28.4.0-base:${BRANCH}-amd64 \
            ${GHCR_PREFIX}/blackcoin-more-28.4.0-base:${BRANCH}-arm64

          # B. Debian Image Manifest
          docker buildx imagetools create \
            -t ${DHU}/blackcoin-more-debian-v28x:${BRANCH} \
            ${GHCR_PREFIX}/blackcoin-more-debian-v28x:${BRANCH}-amd64 \
            ${GHCR_PREFIX}/blackcoin-more-debian-v28x:${BRANCH}-arm64

          # C. Minimal Image Manifest
          docker buildx imagetools create \
            -t ${DHU}/blackcoin-more-minimal-v28x:${BRANCH} \
            ${GHCR_PREFIX}/blackcoin-more-minimal-v28x:${BRANCH}-amd64 \
            ${GHCR_PREFIX}/blackcoin-more-minimal-v28x:${BRANCH}-arm64
