name: build and push docker images

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "docker-platforms"
          - "linux-64-bit"
          - "linux-32-bit"
          - "windows-64-bit"
          - "macos-64-bit"
          - "macos-arm-64-bit"
          - "linux-arm-32-bit"
          - "linux-arm-64-bit"
      publish_docker:
        description: "Publish Docker Images? (Requires platform: all or docker-platforms)"
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}

    env:
      SDK_URL: https://bitcoincore.org/depends-sources/sdks

    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-32-bit
          - linux-64-bit
          - windows-64-bit
          - macos-64-bit
          - macos-arm-64-bit
          - linux-arm-32-bit
          - linux-arm-64-bit
        include:
          - name: linux-32-bit
            host: i686-pc-linux-gnu
            os: ubuntu-22.04
            packages: "gcc-12 g++-12 gcc-12-multilib g++-12-multilib binutils"
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "LDFLAGS=-static-libstdc++"
            goal: install-strip

          - name: linux-64-bit
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            packages: "gcc-12 g++-12 binutils"
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "--enable-sse2 LDFLAGS=-static-libstdc++"
            goal: install-strip

          - name: windows-64-bit
            host: x86_64-w64-mingw32
            os: ubuntu-24.04
            packages: nsis g++-mingw-w64-x86-64-posix
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "--enable-sse2 LDFLAGS=-static-libgcc"
            goal: install-strip deploy

          - name: macos-64-bit
            host: x86_64-apple-darwin
            os: ubuntu-24.04
            packages: clang lld llvm g++ zip
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "--enable-sse2"
            goal: install-strip deploy
            sdk: 12.2-12B45b

          - name: macos-arm-64-bit
            host: arm64-apple-darwin
            os: ubuntu-24.04
            packages: clang lld llvm g++ zip
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: ""
            goal: install-strip deploy
            sdk: 12.2-12B45b

          - name: linux-arm-32-bit
            host: arm-linux-gnueabihf
            os: ubuntu-22.04
            packages: "gcc-12 g++-12 gcc-12-arm-linux-gnueabihf g++-12-arm-linux-gnueabihf binutils-arm-linux-gnueabihf"
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "LDFLAGS=-static-libstdc++"
            goal: install-strip

          - name: linux-arm-64-bit
            host: aarch64-linux-gnu
            os: ubuntu-22.04
            packages: "gcc-12 g++-12 gcc-12 g++-12 gcc-12-aarch64-linux-gnu g++-12-aarch64-linux-gnu binutils-aarch64-linux-gnu"
            check-security: false
            check-symbols: false
            dep-opts: ""
            config-opts: "LDFLAGS=-static-libstdc++"
            goal: install-strip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check target platform
        id: check_platform
        run: |
          SHOULD_BUILD="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target_platform }}"
            MATRIX_NAME="${{ matrix.name }}"
            if [ "$TARGET" != "all" ] && [ "$TARGET" != "$MATRIX_NAME" ]; then
              if [ "$TARGET" = "docker-platforms" ] && { [ "$MATRIX_NAME" = "linux-64-bit" ] || [ "$MATRIX_NAME" = "linux-arm-64-bit" ]; }; then
                SHOULD_BUILD="true"
              else
                SHOULD_BUILD="false"
              fi
            fi
          fi
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Set dynamic MAKEJOBS
        if: steps.check_platform.outputs.should_build == 'true'
        run: echo "MAKEJOBS=$(nproc)" >> $GITHUB_ENV

      - name: Install packages
        if: steps.check_platform.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils cmake curl git make patch python3 xz-utils bison
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Set gcc-12 as default (native x86)
        if: steps.check_platform.outputs.should_build == 'true' && (matrix.host == 'i686-pc-linux-gnu' || matrix.host == 'x86_64-pc-linux-gnu')
        run: |
          # register gcc-11 if present (ignore errors)
          if command -v gcc-11 >/dev/null 2>&1; then
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110 \
              --slave /usr/bin/g++ g++ /usr/bin/g++-11 || true
          fi
          # register gcc-12 with higher priority
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
          gcc --version
          g++ --version

      - name: Set arm-linux-gnueabihf-gcc to GCC 12
        if: steps.check_platform.outputs.should_build == 'true' && matrix.host == 'arm-linux-gnueabihf'
        run: |
          # Prefer the GCC 12 cross compiler for this triplet
          if command -v arm-linux-gnueabihf-gcc-11 >/dev/null 2>&1; then
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-11 110 || true
            sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-g++ arm-linux-gnueabihf-g++ /usr/bin/arm-linux-gnueabihf-g++-11 110 || true
          fi
          sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-12 120
          sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-g++ arm-linux-gnueabihf-g++ /usr/bin/arm-linux-gnueabihf-g++-12 120

          arm-linux-gnueabihf-gcc --version

      - name: Set aarch64-linux-gnu-gcc to GCC 12
        if: steps.check_platform.outputs.should_build == 'true' && matrix.host == 'aarch64-linux-gnu'
        run: |
          if command -v aarch64-linux-gnu-gcc-11 >/dev/null 2>&1; then
            sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-11 110 || true
            sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-g++ aarch64-linux-gnu-g++ /usr/bin/aarch64-linux-gnu-g++-11 110 || true
          fi
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 120
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-g++ aarch64-linux-gnu-g++ /usr/bin/aarch64-linux-gnu-g++-12 120

          aarch64-linux-gnu-gcc --version

      - name: Checkout
        if: steps.check_platform.outputs.should_build == 'true'
        uses: actions/checkout@v7.0.1

      - name: SDK cache
        if: steps.check_platform.outputs.should_build == 'true' && matrix.sdk
        uses: actions/cache@v6.1.0
        env:
          cache-name: sdk
        with:
          path: ./depends/sdk-sources
          key: ${{ matrix.name }}-${{ env.cache-name }}

      - name: Install SDK
        if: steps.check_platform.outputs.should_build == 'true' && matrix.sdk
        run: |
          mkdir -p ./depends/sdk-sources
          mkdir -p ./depends/SDKs
          curl --location --fail $SDK_URL/Xcode-${{ matrix.sdk }}-extracted-SDK-with-libcxx-headers.tar.gz -o depends/sdk-sources/Xcode-${{ matrix.sdk }}-extracted-SDK-with-libcxx-headers.tar.gz
          tar -C depends/SDKs -xzvf depends/sdk-sources/Xcode-${{ matrix.sdk }}-extracted-SDK-with-libcxx-headers.tar.gz

      - name: Dependency cache
        if: steps.check_platform.outputs.should_build == 'true'
        uses: actions/cache@v6.1.0
        env:
          cache-name: depends
        with:
          path: ./depends/built
          key: ${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('depends/packages/*') }}

      - name: Build depends
        if: steps.check_platform.outputs.should_build == 'true'
        # ARM jobs rely on their explicit cross compilers; native jobs use gcc-12 via alternatives
        run: |
          make -j $MAKEJOBS -C depends HOST=${{ matrix.host }} ${{ matrix.dep-opts }}

      - name: Build Blackcoin More
        if: steps.check_platform.outputs.should_build == 'true'
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site ./configure --prefix=`pwd`/depends/${{ matrix.host }} ${{ matrix.config-opts }} --enable-reduce-exports || ( cat config.log && false)
          for goal in ${{ matrix.goal }}; do
            make -j $MAKEJOBS "$goal" || { echo "Build failure. Verbose build follows."; make "$goal" V=1; false; }
          done

      - name: Check security
        if: steps.check_platform.outputs.should_build == 'true' && matrix.check-security
        run: make -C src check-security

      - name: Check symbols
        if: steps.check_platform.outputs.should_build == 'true' && matrix.check-symbols
        run: make -C src check-symbols

      - name: Upload artifacts
        if: steps.check_platform.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: blackmore-${{ github.sha }}-${{ matrix.name }}
          path: |
            depends/${{ matrix.host }}/bin/*blackmore*
            dist/Blackmore-Qt.app
            blackcoin-*-win64-setup.exe
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Build & Push Docker Images
    needs: build
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || (inputs.publish_docker == true && (inputs.target_platform == 'all' || inputs.target_platform == 'docker-platforms')))
    runs-on: ubuntu-22.04
    env:
      DOCKER_HUB_DEST: ${{ secrets.DOCKER_HUB_DEST }}
    steps:
      - name: Checkout Dockerfiles
        uses: actions/checkout@v7.0.1
        with:
          repository: BlackcoinDev/docker-blk
          ref: main

      - name: Download AMD64 Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: blackmore-${{ github.sha }}-linux-64-bit
          path: bin/amd64

      - name: Download ARM64 Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: blackmore-${{ github.sha }}-linux-arm-64-bit
          path: bin/arm64

      - name: Flatten Artifact Paths
        run: |
          find bin/amd64 -type f -name "*blackmore*" -exec cp {} bin/amd64/ \;
          find bin/arm64 -type f -name "*blackmore*" -exec cp {} bin/arm64/ \;
          chmod +x bin/amd64/*blackmore*
          chmod +x bin/arm64/*blackmore*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push debian multi-arch image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_HUB_DEST }}/blackcoin-more-26.2.0-debian:${{ github.ref_name }}

      - name: Build and push minimal multi-arch image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.minimal.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_HUB_DEST }}/blackcoin-more-26.2.0-minimal:${{ github.ref_name }}